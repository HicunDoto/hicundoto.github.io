<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undangan Pernikahan</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #fcf9f2;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 600px;
            padding: 60px 40px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            margin: 20px;
        }
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            color: #b78d65;
            margin-bottom: 10px;
            margin-top: 20px;
        }
        p {
            line-height: 1.6;
            color: #666;
            font-size: 1.1rem;
        }
        .subtitle {
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #888;
        }
        .date {
            font-size: 1.3rem;
            font-weight: 600;
            margin: 30px 0;
            color: #444;
            padding: 15px;
            border-top: 1px solid #eee;
            border-bottom: 1px solid #eee;
        }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 30px;
            background-color: #b78d65;
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-weight: 600;
            transition: background-color 0.3s;
        }
        .btn:hover {
            background-color: #9c7551;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="subtitle">Save The Date</div>
        <h1>Romeo & Juliet</h1>
        <p>Dengan memohon rahmat dan ridho Tuhan Yang Maha Esa, kami mengundang Bapak/Ibu/Saudara/i untuk hadir pada acara pernikahan kami.</p>
        
        <div class="date">
            Sabtu, 12 Desember 2026<br>
            <span style="font-size: 0.9rem; font-weight: normal; color: #666;">Pukul 09:00 WIB - Selesai</span>
        </div>
        
        <p><strong>Lokasi Acara</strong><br>Gedung Pernikahan Impian<br>Jl. Cinta Kasih No. 1, Jakarta</p>
        
        <a href="#" class="btn">Buka Undangan</a>
    </div>
</body>
</html>
