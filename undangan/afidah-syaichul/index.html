        .header {

            padding: 18px 24px;
            position: sticky; top: 0; z-index: 100;

        .header-inner { max-width: 900px; margin: 0 auto; display: flex; align-items: center; gap: 16px; }
        .header-icon {
            width: 48px; height: 48px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border-radius: 14px; display: flex; align-items: center; justify-content: center;
            font-size: 1.4rem; color: white; flex-shrink: 0;
            box-shadow: 0 4px 16px rgba(37, 211, 102, 0.35);
        }
        .header-text h1 { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 1.2rem; font-weight: 700; }
        .header-text p { font-size: 0.78rem; color: var(--text-muted); margin-top: 2px; }
        .header-actions { margin-left: auto; }

        .stat-dot { width: 10px; height: 10px; border-radius: 50%; }
        .stat-dot.sent { background: var(--primary); }
        .stat-dot.unsent { background: var(--text-muted); }
        .stat-label { color: var(--text-muted); }
        .stat-value { font-weight: 600; }
        .progress-bar-wrap { flex: 1; min-width: 120px; background: rgba(255,255,255,0.06); border-radius: 20px; height: 8px; overflow: hidden; }
        .progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--primary-dark), var(--primary)); border-radius: 20px; transition: width 0.5s ease; }
        .sent-chip { background: rgba(37,211,102,0.15); color: var(--primary); border: 1px solid rgba(37,211,102,0.3); border-radius: 20px; padding: 3px 12px; font-size: 0.75rem; font-weight: 600; }
        /* TOOLBAR */
        .toolbar { max-width: 900px; margin: 18px auto 0; padding: 0 24px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        .search-box { flex: 1; min-width: 180px; position: relative; }
        .search-box input {
            width: 100%; background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 12px; padding: 10px 16px 10px 40px; color: var(--text);
            font-size: 0.88rem; font-family: 'Inter', sans-serif; outline: none;
        }
        .search-box input:focus { border-color: rgba(37,211,102,0.4); }
        .search-box input::placeholder { color: var(--text-muted); }
        .search-box i { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
        .filter-btn {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px;
            padding: 9px 15px; color: var(--text-muted); font-size: 0.82rem;
            font-family: 'Inter', sans-serif; cursor: pointer; transition: all 0.2s;
            display: flex; align-items: center; gap: 6px;
        }
        .filter-btn:hover { border-color: rgba(255,255,255,0.2); color: var(--text); }
        .filter-btn.active { background: var(--primary); border-color: var(--primary); color: white; }
        /* CATEGORY CHIPS */
        .category-chips { max-width: 900px; margin: 12px auto 0; padding: 0 24px; display: flex; gap: 8px; flex-wrap: wrap; }
        .chip { background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px; padding: 5px 14px; font-size: 0.78rem; color: var(--text-muted); cursor: pointer; transition: all 0.2s; }
        .chip:hover { border-color: rgba(255,255,255,0.2); color: var(--text); }
        .chip.active { background: rgba(37,211,102,0.15); border-color: rgba(37,211,102,0.5); color: var(--primary); }
        #result-count { max-width: 900px; margin: 10px auto 0; padding: 0 24px; font-size: 0.8rem; color: var(--text-muted); }
        /* CONTACT LIST */
        .contact-list { max-width: 900px; margin: 16px auto 40px; padding: 0 24px; display: flex; flex-direction: column; gap: 10px; }
        .contact-card {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px;
            padding: 14px 16px; display: flex; align-items: center; gap: 12px;

        .contact-card.is-sent { background: var(--sent-bg); border-color: var(--sent-border); }
        .contact-card.is-sent .contact-name { color: #a8f0c6; }
        .contact-avatar { width: 42px; height: 42px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.95rem; flex-shrink: 0; text-transform: uppercase; }
        .contact-info { flex: 1; min-width: 0; }
        .contact-name { font-size: 0.93rem; font-weight: 600; font-family: 'Plus Jakarta Sans', sans-serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-transform: capitalize; }
        .contact-meta { display: flex; align-items: center; gap: 8px; margin-top: 3px; flex-wrap: wrap; }
        .contact-phone { font-size: 0.78rem; color: var(--text-muted); }
        .contact-badge { font-size: 0.67rem; padding: 2px 8px; border-radius: 20px; font-weight: 500; flex-shrink: 0; }
        .badge-kat { background: rgba(212,175,55,0.15); color: #d4af37; border: 1px solid rgba(212,175,55,0.3); }

        .contact-actions { display: flex; gap: 7px; flex-shrink: 0; align-items: center; }

        .btn-unmark {

function toWA(hp) {
    let n = hp.replace(/[-\s]/g, '');

}

    let html = `<div class="chip ${curCat===''?'active':''}" onclick="setCat('')">Semua</div>`;
    getCategories().forEach(cat => {
        html += `<div class="chip ${curCat===cat?'active':''}" onclick="setCat('${cat}')">${cat}</div>`;
    });
    el.innerHTML = html;
}

function getFiltered() {
    const q = document.getElementById('search-input').value.toLowerCase();
    return CONTACTS.filter(c => {
        const sent = sentSet.has(c.no);
        const mStatus = curFilter==='all'||(curFilter==='sent'&&sent)||(curFilter==='unsent'&&!sent);
        const mCat = !curCat || c.kat===curCat;
        const mQ = !q || c.nama.toLowerCase().includes(q) || c.hp.includes(q);
        return mStatus && mCat && mQ;
    });
}

function renderList() {
    const list = document.getElementById('contact-list');
    const filtered = getFiltered();
    document.getElementById('result-count').textContent = filtered.length < CONTACTS.length
        ? `Menampilkan ${filtered.length} dari ${CONTACTS.length} kontak`
        : `${CONTACTS.length} kontak dengan nomor WA`;

    if (!filtered.length) {
        list.innerHTML = '<div class="empty-state"><i class="bi bi-person-x"></i><p>Tidak ada kontak yang sesuai filter</p></div>';
        updateStats(); return;
    }

    list.innerHTML = '';
    filtered.forEach(c => {
        const sent = sentSet.has(c.no);
        const col = COLORS[parseInt(c.no) % COLORS.length];
        const init = c.nama.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
        const div = document.createElement('div');
        div.className = 'contact-card' + (sent?' is-sent':'');
        div.innerHTML = `
            <div class="contact-avatar" style="background:${col}22;color:${col};border:1.5px solid ${col}55">${init}</div>
            <div class="contact-info">
                <div class="contact-name">${c.nama}</div>
                <div class="contact-meta">
                    <span class="contact-phone"><i class="bi bi-telephone" style="font-size:.7rem;margin-right:2px"></i>${c.hp}</span>
                    <span class="contact-badge badge-kat">${c.kat}</span>
                    <span class="contact-badge ${c.jenis==='Digital'?'badge-digital':'badge-cetak'}">${c.jenis}</span>
                </div>
                ${sent?'<div class="contact-sent-label"><i class="bi bi-check2-all"></i> Sudah terkirim</div>':''}
            </div>
            <div class="contact-actions">
                ${sent
                    ? `<button class="btn-resend" onclick="preview('${c.no}')"><i class="bi bi-arrow-repeat"></i> Kirim Ulang</button>
                       <button class="btn-unmark" onclick="markUnsent('${c.no}')" title="Tandai belum terkirim"><i class="bi bi-x-circle"></i></button>`
                    : `<button class="btn-send" onclick="preview('${c.no}')"><i class="bi bi-whatsapp"></i> Kirim</button>`
                }
            </div>
        `;
        list.appendChild(div);
    });
    updateStats();
}

function updateStats() {
    const total = CONTACTS.length;
    const sent = sentSet.size;
    const pct = Math.round(sent/total*100);
    document.getElementById('stat-total').textContent = total;
    document.getElementById('stat-sent').textContent = sent;
    document.getElementById('stat-unsent').textContent = total-sent;
    document.getElementById('progress-fill').style.width = pct+'%';
    document.getElementById('progress-pct').textContent = pct+'%';
}

function setStatusFilter(f) {
    curFilter = f;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('filter-'+f).classList.add('active');
    renderList();
}

function setCat(cat) {
    curCat = cat; renderChips(); renderList();
}

function applyFilters() { renderList(); }

function preview(no) {
    const c = CONTACTS.find(x => x.no===no);
    if (!c) return;
    pendingContact = c;
    document.getElementById('modal-msg').textContent = buildMsg(c.nama);
    document.getElementById('modal-preview').classList.add('show');
}

function confirmSend() {
    if (!pendingContact) return;
    const c = pendingContact;
    window.open('https://wa.me/'+toWA(c.hp)+'?text='+encodeURIComponent(buildMsg(c.nama)), '_blank');
    sentSet.add(c.no);
    localStorage.setItem(LS_KEY, JSON.stringify([...sentSet]));
    closeModal(); renderList();
}

function markUnsent(no) {
    sentSet.delete(no);
    localStorage.setItem(LS_KEY, JSON.stringify([...sentSet]));
    renderList();
}

function closeModal() {
    document.getElementById('modal-preview').classList.remove('show');
    pendingContact = null;
}

function resetAll() {
    if (!confirm('Reset semua status kirim?')) return;
    sentSet.clear(); localStorage.removeItem(LS_KEY);
    renderChips(); renderList();
}

document.getElementById('modal-preview').addEventListener('click', e => { if(e.target===e.currentTarget) closeModal(); });

// INIT
renderChips();
renderList();
</script>
</body>
</html>
